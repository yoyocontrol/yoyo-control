# uu Link: the phone ↔ computer transport (docs/LINK.md). One Rust core, exposed to Swift (ffi/, UniFFI) and to
# Node (node/, napi-rs), its client media layer to browsers (wasm/, wasm-bindgen); tools/ has the impairment proxy and the probe CLI.
[workspace]
resolver = "3"
members = ["core", "media", "ffi", "node", "wasm", "tools/netem", "tools/probe"]
exclude = ["vendor/sctp-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
uu-link = { path = "core" }
uu-link-media = { path = "media" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath", "portmapper"] }
# netdev 0.46.3 (through iroh) does not build for aarch64-apple-ios with libc 0.2.191
libc = "=0.2.186"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
base64 = "0.22"
data-encoding = "2.11"
thiserror = "2"
tracing = "0.1"
n0-future = "0.3"
n0-watcher = "1"
async-trait = "0.1"
rand = "0.9"
# WebRTC (rtc transport): sans-IO ICE / DTLS / SCTP; aws-lc-rs is what its DTLS stack needs for certificates anyway
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
# the UDP layer iroh already uses (destination address per packet on wildcard sockets), interfaces, socket options
noq-udp = "1.4"
netdev = "0.46"
socket2 = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The Node addon is loaded into a process that may catch errors: unwinding there, not aborting.
[profile.release-node]
inherits = "release"
panic = "unwind"

# sctp-proto (str0m's SCTP) with uu's patch: empty data channel messages (the rtc streams' FIN) go out as one byte
# (RFC 8831 §6.6) instead of not at all. vendor/sctp-proto is 0.10.8 from crates.io plus that one change.
[patch.crates-io]
sctp-proto = { path = "vendor/sctp-proto" }

# The browser's media layer (packages/link-web): wasm-bindgen reads the `target_features` section, which `strip`
# would remove (it drops the names and debug info itself).
[profile.release-wasm]
inherits = "release"
strip = false
