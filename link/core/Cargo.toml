[package]
name = "uu-link"
description = "uu Link core: endpoint, identity binding, session (control, RPC, datagram channels), congestion control, stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uu-link-media.workspace = true
iroh.workspace = true
libc.workspace = true
tokio.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
ring.workspace = true
base64.workspace = true
data-encoding.workspace = true
thiserror.workspace = true
tracing.workspace = true
n0-future.workspace = true
n0-watcher.workspace = true
async-trait.workspace = true
str0m.workspace = true
noq-udp.workspace = true
socket2.workspace = true
netdev.workspace = true

[features]
# hooks for the integration tests only (tests/rtc.rs: refused grant writes); never in a build that ships
test-hooks = []

[dev-dependencies]
# the integration tests build the core with its test hooks
uu-link = { path = ".", features = ["test-hooks"] }
tokio = { workspace = true, features = ["test-util"] }
rand.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# a relay on 127.0.0.1 for the guard's relayed tests (plain http)
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "test-utils", "tls-ring"] }
