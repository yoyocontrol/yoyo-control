[package]
name = "uu-link-node"
description = "uu Link for Node (napi-rs): the .node addon inside @yoyocontrol/link (packages/link)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
uu-link.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
tokio.workspace = true
bytes.workspace = true
serde_json.workspace = true
async-trait.workspace = true
n0-future.workspace = true

[build-dependencies]
napi-build = "2"
